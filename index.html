<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Lil Guy Dev Board</title>
<style>
  #devButtons {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 12px;               /* change this to adjust spacing */
  }
  #devButtons button {
    padding: 8px 12px;
    font-family: monospace;
  }
</style>

<div id="devButtons">
  <button id="wipeDev">reset dev save</button>
  <button id="checkWeather">check weather</button>
  <button id="checkHunger">check hunger</button>
</div>

<script>
  const buttonLinks = {
    wipeDev:      "https://example.com/reset",    // <- put your URLs here
    checkWeather: "https://example.com/weather",
    checkHunger:  "https://example.com/hunger",
  };

  for (const [id, url] of Object.entries(buttonLinks)) {
    document.getElementById(id).addEventListener("click", () => {
      window.open(url, "_blank", "noopener");
    });
  }
</script>
