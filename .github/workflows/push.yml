name: Push to lilguy-notifier

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (source)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout lilguy-notifier (target)
        uses: actions/checkout@v4
        with:
          repository: dev-nuII/lilguy-notifier
          path: target
          token: ${{ secrets.LILGUY_NOTIFIER_PAT }}

      - name: Sync files, protecting production-only files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='api/save-push.js' \
            --exclude='api/save-game.js' \
            --exclude='api/load-save.js' \
            source/ target/

      - name: Commit and push changes
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync from source repo (excluding dev-only files)"
          git push
